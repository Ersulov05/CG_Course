<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиент для лавы -->
  <defs>
    <radialGradient id="lavaGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#FF4500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B0000;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Капля лавы -->
  <path d="M50 15 
           L25 45 
           Q20 65 35 80 
           Q50 90 65 80 
           Q80 65 75 45 
           L50 15" 
        fill="url(#lavaGradient)" 
        stroke="#8B0000" 
        stroke-width="2"/>
  
  <!-- Блик (жар) -->
  <path d="M45 30 Q50 20 55 30" fill="#FFD700" opacity="0.6"/>
  
  <!-- Искры -->
  <circle cx="30" cy="60" r="3" fill="#FFA500"/>
  <circle cx="65" cy="65" r="4" fill="#FFA500"/>
  <circle cx="45" cy="75" r="2" fill="#FFD700"/>
</svg>