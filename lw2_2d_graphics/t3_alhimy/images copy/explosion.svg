<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиент для взрыва -->
  <defs>
    <radialGradient id="explosionGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B0000;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Грибовидное облако взрыва -->
  <circle cx="50" cy="50" r="35" fill="url(#explosionGradient)" opacity="0.9"/>
  
  <!-- Взрывная волна -->
  <path d="M20 50 Q35 20 50 20 Q70 20 80 35 Q85 50 75 65 Q65 80 45 80 Q25 75 20 50" 
        fill="#FF4500" stroke="#FFD700" stroke-width="2"/>
  
  <!-- Искры -->
  <circle cx="30" cy="30" r="5" fill="#FFD700"/>
  <circle cx="70" cy="30" r="5" fill="#FFD700"/>
  <circle cx="75" cy="70" r="4" fill="#FF8C00"/>
  <circle cx="25" cy="70" r="4" fill="#FF8C00"/>
  
  <!-- Лучи взрыва -->
  <path d="M50 5 L50 15 M95 50 L85 50 M50 95 L50 85 M5 50 L15 50" 
        stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
  <path d="M80 20 L73 27 M80 80 L73 73 M20 80 L27 73 M20 20 L27 27" 
        stroke="#FF8C00" stroke-width="2" stroke-linecap="round"/>
</svg>